[tool.uv.workspace]
members = [
    "packages/core",
    "packages/daemon",
    "packages/cli",
    "packages/tui",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-toml",
]

[tool.ruff]
target-version = "py313"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style          = "double"
indent-style         = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version       = "3.13"
strict               = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["tests"]
addopts        = "--cov=packages --cov-report=term-missing -q"